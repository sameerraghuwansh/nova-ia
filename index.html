<script>
const descriptions = {
  Chat: "Ask questions, explore ideas and get explanations.",
  Translate: "Translate between languages.",
  Write: "Draft emails, stories and more.",
  Images: "Describe image concepts.",
  Code: "Get help understanding code.",
  Learn: "Learn topics step by step."
};

let active = "Chat";
const chat = document.getElementById("chat");
const histories = { Chat: chat.innerHTML };

document.getElementById("clearChat").addEventListener("click", () => {
  chat.innerHTML = '<div class="msg bot">Chat cleared!</div>';
  histories[active] = chat.innerHTML;
});

document.querySelectorAll(".tile").forEach(btn => {
  btn.addEventListener("click", () => {
    histories[active] = chat.innerHTML;
    document.querySelectorAll(".tile").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    active = btn.dataset.tool;
    chat.innerHTML = histories[active] || '<div class="msg bot">Start a new conversation!</div>';
    document.getElementById("activeTitle").textContent = btn.querySelector("b").textContent;
    document.getElementById("toolTitle").textContent = descriptions[active];
  });
});

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const box = document.getElementById("prompt");
  const value = box.value.trim();
  if (!value) return;

  const u = document.createElement("div");
  u.className = "msg user";
  u.textContent = value;
  chat.appendChild(u);

  const b = document.createElement("div");
  b.className = "msg bot";
  b.textContent = "NOVA AI is thinking...";
  chat.appendChild(b);
  box.value = "";

  try {
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: value })
    });
    const data = await response.json();
    if (!response.ok) throw new Error("Request failed");
    b.textContent = data.reply;
  } catch (error) {
    b.textContent = "Connection error. Please try again.";
  }

  histories[active] = chat.innerHTML;
  chat.scrollTop = chat.scrollHeight;
});
